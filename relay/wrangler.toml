# Cloudflare Worker: WebSocket relay for Cadillacs & Dinosaurs II online co-op (see README.md).
# Runs on the Workers FREE plan: one SQLite-backed Durable Object per room (new_sqlite_classes), no card needed.
name = "cnd2-relay"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
# Pages allowed to open a relay socket (checked against the browser's Origin header). "*" matches any port.
ALLOWED_ORIGINS = "https://cadillacsanddinosaurs2.vercel.app,http://localhost:*,http://127.0.0.1:*"
